name: cctv-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cctv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cctv_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cctv}
    ports:
      # Host port 5433, not 5432: this machine already has a native Postgres
      # service bound to 5432 outside Docker. Container-internal port stays
      # 5432 (only the host-side mapping changes).
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cctv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NOTE: the spec's recommended local dev store is MinIO, but as of this
  # environment Docker Hub rejects anonymous pulls of minio/minio and minio/mc
  # ("pull access denied") following MinIO's Nov-2024 restriction of their
  # public container images. LocalStack's S3 service is a drop-in substitute
  # for local dev only — the application only ever talks to the generic AWS S3
  # SDK/API, so no app code changes with this swap, and production still
  # targets real AWS S3. See docs/storage-costs.md and docs/architecture.md §7.
  s3:
    image: localstack/localstack:3
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the recordings bucket so the api doesn't have to carry
  # bucket-provisioning logic. Exits after running; `docker compose up` will
  # show it as "exited (0)", which is expected.
  s3-init:
    image: amazon/aws-cli:2.17.62
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url=http://s3:4566 s3 mb s3://${STORAGE_BUCKET:-cctv-recordings} || true

  # RTSP/WebRTC/HLS media server (MIT license — see docs/foundation-assessment.md).
  # This is the real target for camera connection-testing/capability-detection
  # work and, later, the recording pipeline. It does not simulate a camera by
  # itself — `simulated-camera` below publishes a synthetic stream into it.
  mediamtx:
    image: bluenviron/mediamtx:1.21.2 # pinned: infra/mediamtx/mediamtx.yml uses keys (e.g. moq) that older versions reject
    restart: unless-stopped
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - mediamtx-recordings:/recordings
    ports:
      # Bound to 127.0.0.1 explicitly, not just "HOST:CONTAINER" — that
      # short syntax binds to 0.0.0.0 (all interfaces) by default, which
      # would make MediaMTX's unauthenticated config/playback APIs
      # (infra/mediamtx/mediamtx.yml's dev-only auth bypass) reachable from
      # anywhere on the LAN, not just this machine as that file assumes.
      # Every current consumer (apps/api, the worker, manual testing) runs
      # on this host, so loopback-only doesn't break anything.
      - "127.0.0.1:8554:8554" # RTSP
      - "127.0.0.1:8888:8888" # HLS — live view, proxied through apps/api (auth-checked)
      - "127.0.0.1:9997:9997" # config API — apps/api uses this to add/remove per-camera recording paths
      - "127.0.0.1:9996:9996" # playback API — apps/api fetches completed segments over HTTP from here

  # Publishes a synthetic, infinitely-looping test-pattern video into MediaTMX
  # over RTSP, standing in for a physical camera. This is what the
  # `SIMULATED` connector type points at — labeled as simulated everywhere it
  # appears in the API/UI, never presented as a real camera. Lets connection
  # testing and capability detection be exercised and verified for real with
  # zero physical hardware (see docs/requirements.md §3, item 5).
  simulated-camera:
    image: jrottenberg/ffmpeg:6-alpine
    restart: unless-stopped
    depends_on:
      - mediamtx
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sleep 3 &&
        ffmpeg -re -f lavfi -i "testsrc=size=1280x720:rate=15"
        -f lavfi -i "sine=frequency=440"
        -c:v libx264 -preset ultrafast -tune zerolatency -g 30
        -c:a aac -ar 44100
        -f rtsp rtsp://mediamtx:8554/simulated

volumes:
  postgres-data:
  localstack-data:
  mediamtx-recordings:

# apps/api and apps/web are run locally with `pnpm dev:api` / `pnpm dev:web`
# against these services for now (see README.md). Containerizing the app
# services themselves is tracked for Phase 9 (production readiness) once the
# apps have real functionality worth shipping in an image.
